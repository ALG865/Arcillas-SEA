name: Medios de la SEA
on:
  push:
    branches: [main]
    paths: [".github/workflows/sea-medios.yml"]
permissions:
  contents: write
jobs:
  medios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar imágenes y PDF de sea-arcillas.es
        run: |
          mkdir m && cd m && git init -q -b sea-medios
          python3 - <<'PY'
          import json, re, os, urllib.request, urllib.parse, time
          UA={"User-Agent":"Mozilla/5.0 (compatible; SEA-web)"}
          def get(u,t=120): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=t).read()
          os.makedirs("img",exist_ok=True); os.makedirs("pdf",exist_ok=True)
          media=[]; p=1
          while p<30:
              try: lote=json.loads(get(f"https://sea-arcillas.es/wp-json/wp/v2/media?per_page=100&page={p}"))
              except Exception as e: print("fin media",p,e); break
              if not lote: break
              media+=lote; p+=1
          json.dump([{"id":m["id"],"url":m.get("source_url"),"mime":m.get("mime_type"),"title":m.get("title",{}).get("rendered"),"caption":m.get("caption",{}).get("rendered"),"alt":m.get("alt_text"),"date":m.get("date")} for m in media],open("media.json","w"),ensure_ascii=False,indent=0)
          urls=set(m.get("source_url") for m in media if m.get("source_url"))
          for t in ["pages","posts"]:
              for x in json.loads(get(f"https://sea-arcillas.es/wp-json/wp/v2/{t}?per_page=100")):
                  for u in re.findall(r'(?:https?:)?//(?:www\.)?sea-arcillas\.es[^"\'\s<>\]]+|/wp-content/uploads/[^"\'\s<>\]]+', x["content"]["rendered"]):
                      if u.startswith("/wp-content"): u="https://sea-arcillas.es"+u
                      if u.startswith("//"): u="https:"+u
                      urls.add(u.replace("http://","https://").replace("www.",""))
          res=[]; t0=time.time()
          for u in sorted(urls):
              if not re.search(r'\.(pdf|jpe?g|png|webp|gif|zip)$',u,re.I): continue
              if time.time()-t0>1800: break
              ext=u.rsplit(".",1)[1].lower(); car="pdf" if ext in("pdf","zip") else "img"
              nom=urllib.parse.unquote(u.split("/uploads/")[-1]).replace("/","__")
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=120); n=int(r.headers.get("Content-Length") or 0)
                  if n>45*2**20: res.append({"url":u,"ok":False,"motivo":f"{n>>20} MB"}); continue
                  d=r.read(); open(f"{car}/{nom}","wb").write(d); res.append({"url":u,"f":f"{car}/{nom}","ok":True,"kb":len(d)>>10})
              except Exception as e: res.append({"url":u,"ok":False,"motivo":str(e)[:80]})
          json.dump(res,open("ficheros.json","w"),ensure_ascii=False,indent=0)
          print(len(res),"ficheros",sum(1 for x in res if x["ok"]),"ok")
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Medios de sea-arcillas.es" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:sea-medios
