name: bajar
on: push
permissions: {contents: write}
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bajar.py || true
      - run: |
          git config user.name bot; git config user.email bot@x
          git add out; git commit -m "resultado [skip ci]" || true; git push
