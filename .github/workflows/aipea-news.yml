name: Boletines AIPEA (temporal)
on:
  push:
    branches: [main]
    paths: [".github/workflows/aipea-news.yml"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq install -y poppler-utils >/dev/null
      - run: |
          mkdir out && cd out
          for u in https://www.aipea.org/newsletter/AIPEA_newsletter_49_2017.pdf https://www.aipea.org/newsletter/AIPEA_newsletter_50_2018.pdf https://aipea.org/newsletter/AIPEA_Newsletter_51_2019.pdf https://aipea.org/newsletter/AIPEA_newsletter_52_2020.pdf https://aipea.org/newsletter/aipea_newsletter_53_2021.pdf https://aipea.org/newsletter/aipea_newsletter_54_2022.pdf https://aipea.org/newsletter/aipea_newsletter_55_2023.pdf https://aipea.org/newsletter/aipea_newsletter_56_2024.pdf https://aipea.org/newsletter/aipea_newsletter_57_2025.pdf https://aipea.org/newsletter/aipea_newsletter_58_2026.pdf; do
            f=$(basename $u); curl -sSL -A "Mozilla/5.0" -o $f "$u" || echo "FALLO $u"
            n=$(pdfinfo $f 2>/dev/null | awk '/Pages/{print $2}'); echo "$f paginas=$n"
            for p in $(seq 1 ${n:-0}); do pdftotext -layout -f $p -l $p $f - > ${f%.pdf}_p$p.txt; done
          done
          grep -il "spanish" *_p*.txt > paginas_spanish.txt || true
          cat paginas_spanish.txt
      - run: |
          cd out
          git init -q && git checkout -q -b aipea-news
          git config user.name bot && git config user.email bot@x
          git add . && git commit -qm boletines
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" aipea-news
