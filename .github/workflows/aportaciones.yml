name: Aportaciones espanolas (consulta)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/aportaciones.py",".github/workflows/aportaciones.yml"]
concurrency:
  group: aportaciones
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/aportaciones.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/aportaciones-candidatos.json
          git diff --cached --quiet || (git commit -q -m "Candidatos de aportaciones españolas" && git pull --rebase -q origin main && git push origin HEAD:main)
