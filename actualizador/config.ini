; CONFIGURACIÓN DEL ACTUALIZADOR DE LA WEB DE LA SEA
; Este archivo se queda en este ordenador. No lo envíes a nadie: puede contener la contraseña del servidor.

[openalex]
; Clave gratuita de OpenAlex (obligatoria desde febrero de 2026) para las publicaciones de los socios y las citas.
; Se consigue una sola vez: crear una cuenta en https://openalex.org y copiar la clave de https://openalex.org/settings/api
clave = 

[publicar]
; modo = manual  -> el programa deja la lista de archivos que hay que subir (ARCHIVOS-PARA-SUBIR.txt)
; modo = ftp     -> el programa sube los archivos al servidor él solo (rellena los datos de abajo)
modo = manual

; Datos del servidor de la SEA (los da el técnico del servidor)
servidor = 
usuario = 
contrasena = 
; Carpeta del servidor donde está la web (por ejemplo /public_html)
carpeta_remota = /
; ftps = si (conexión cifrada, recomendado) o no
ftps = si
