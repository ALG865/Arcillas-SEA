name: PDF pendientes de la SEA
on:
  push:
    branches: [main]
    paths: [".github/workflows/faltan.yml"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar
        run: |
          mkdir f && cd f && git init -q -b faltan
          python3 - <<'PY'
          import urllib.request, urllib.parse
          U=["2022/02/Libro-de-resúmenes-SEA-2021.pdf","2022/04/XXVII-Reunión-de-la-SEA_Madrid-2021_Libro-de-resúmenes-SEA-2021.pdf","2018/02/2016-SEA-Libro-de-resúmenes_XXIV-SEA2016.pdf","2018/01/Activities-of-the-SEA-in-2011.pdf","2022/10/MSuárez.png"]
          import json
          for u in U:
              url="https://sea-arcillas.es/wp-content/uploads/"+urllib.parse.quote(u)
              try:
                  d=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=120).read()
                  open(u.split("/")[-1],"wb").write(d); print("OK",u,len(d))
              except Exception as e: print("FALTA",u,e)
          PY
          ls -la > lista.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "PDF pendientes" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:faltan
