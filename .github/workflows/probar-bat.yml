name: Probar actualizar-web.bat en Windows
on: workflow_dispatch
jobs:
  probar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: cmd
        run: echo.| actualizar-web.bat
      - shell: bash
        run: cat ULTIMA-ACTUALIZACION.txt; git status --short | head; git diff --stat | tail -3
