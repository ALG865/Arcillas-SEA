name: Sonda SEA
on:
  push:
    branches: [main]
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: JSON de WordPress
        run: |
          mkdir s && cd s && git init -q -b sonda
          for t in pages posts; do for p in 1 2 3; do curl -fsSL -A "Mozilla/5.0" "https://sea-arcillas.es/wp-json/wp/v2/$t?per_page=100&page=$p" -o "${t}_$p.json" || rm -f "${t}_$p.json"; done; done
          curl -fsSL -A "Mozilla/5.0" https://sea-arcillas.es/ -o portada.html || true
          ls -la > lista.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Sonda" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:sonda
