name: Traer fuentes
# Descarga el contenido de sea-arcillas.es (API de WordPress y PDF) y otras fuentes
# a la rama datos-fuentes. No toca la web publicada.
on:
  push:
    branches: [main]
    paths: ["fuentes/**", ".github/workflows/fuentes.yml"]
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: web }
      - name: Rama de datos
        run: |
          git clone --depth 1 --branch datos-fuentes "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos || (mkdir datos && cd datos && git init -b datos-fuentes && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
          mkdir -p datos/bajado/cif datos/bajado/sea/json datos/bajado/sea/pdf datos/bajado/sea/img
      - name: Descargar
        working-directory: datos
        env: { UA: "Mozilla/5.0 (compatible; SEA-web-divulgacion)" }
        run: |
          while IFS=$'\t' read -r nombre url; do
            [ -z "$nombre" ] && continue; [ -f "bajado/$nombre" ] && continue
            curl -fsSL --retry 3 -A "$UA" -o "bajado/$nombre" "$url" && echo "OK $nombre" || { echo "FALTA $nombre"; rm -f "bajado/$nombre"; }
            sleep 1
          done < ../web/fuentes/urls.tsv
          python3 ../web/fuentes/traer.py
      - name: Guardar
        working-directory: datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Fuentes descargadas"
          git push origin HEAD:datos-fuentes
