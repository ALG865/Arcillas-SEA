name: Publicaciones de los socios
on:
  workflow_dispatch:
concurrency:
  group: publicaciones
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publicaciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar OpenAlex
        run: |
          if [ ! -f tools/socios.json ]; then echo "La lista de socios no está en el repositorio (solo en el ordenador del encargado). Ejecuta actualizar-web.bat."; exit 0; fi
          python3 tools/publicaciones.py
      - name: Guardar y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicaciones.js
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Publicaciones de los socios actualizadas"
          git pull --rebase -q origin main && git push origin HEAD:main
          git fetch -q origin main && git push --force origin origin/main:gh-pages
