name: Boletin AIPEA 2011 (temporal)
on:
  push:
    branches: [main]
    paths: [".github/workflows/aipea-2011.yml"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -sSL -A "Mozilla/5.0" -o n44.pdf "https://www.aipea.org/newsletter/AIPEA_Newsletter_44%20A4.pdf"
          curl -sSL -A "Mozilla/5.0" -o n43.pdf "https://www.aipea.org/newsletter/AIPEA_newsletter_43%20A4.pdf"
          ls -la
      - run: |
          cd out && git init -q && git checkout -q -b tmp-2011 && git config user.name bot && git config user.email bot@x
          git add . && git commit -qm b && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-2011
